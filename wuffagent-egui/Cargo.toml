[package]
name = "wuffagent-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
wuffagent-core = { path = "../wuffagent-core" }
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"
epaint_default_fonts = "0.36"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
rfd = "0.14"
reqwest = { version = "0.12", features = ["stream"] }
base64 = "0.22"
# Clipboard image access (Ctrl/Cmd+V paste) — the same crate egui-winit uses.
arboard = "3.6"
# Decoding picked image files + re-encoding clipboard pixels as PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
