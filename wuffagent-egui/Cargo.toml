[package]
name = "wuffagent-egui"
version = "0.1.0"
edition = "2021"

[dependencies]
wuffagent-core = { path = "../wuffagent-core" }
eframe = "0.30"
egui = "0.30"
epaint_default_fonts = "0.30"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
rfd = "0.14"
reqwest = { version = "0.12", features = ["stream"] }
base64 = "0.22"
