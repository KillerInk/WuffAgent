[package]
name = "wuffagent"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/main.rs"

[[bin]]
name = "wuffagent"
path = "src/main.rs"

[dependencies]
eframe = "0.30"
egui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
thiserror = "1.0"
http = "1.1"
rfd = { version = "0.14", optional = true }
libloading = "0.9.0"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0"
chacha20poly1305 = "0.10"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.0"
