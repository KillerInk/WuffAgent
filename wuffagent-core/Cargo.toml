[package]
name = "wuffagent-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "wuffagent_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
thiserror = "1.0"
libloading = "0.9.0"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["io"] }
glob = "0.3.1"
regex = "1.10"
# Image decoding/encoding for the `show_image` tool (same format set as the
# egui side's file picker: png/jpg/gif/bmp/webp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3.0"

# Windows support for graceful llama-server shutdown:
# - `CREATE_NEW_PROCESS_GROUP` (Win32_System_Threading) at spawn, so the child
#   has its own process group (group id = child pid).
# - `GenerateConsoleCtrlEvent(CTRL_C_EVENT, <group>)` (Win32_System_Console)
#   at stop, with a 5 s wait + `kill()` fallback.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
