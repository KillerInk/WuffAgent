[package]
name = "wuffagent-iced-app"
version = "0.1.0"
edition = "2021"

[dependencies]
wuffagent-core = { path = "../wuffagent-core" }
iced = "0.14"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
