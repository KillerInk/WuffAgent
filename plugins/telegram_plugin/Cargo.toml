[package]
name = "telegram_plugin"
version = "0.1.0"
edition = "2021"
description = "WuffAgent plugin: talk to WuffAgent from a Telegram bot (telegram tool + in-process long-poll)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wuffagent-core = { path = "../../wuffagent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
